syntax = "proto3";

package account_vault.credentials;

import "google/protobuf/timestamp.proto";
import "common.proto";

// ─────────────────────────────────────────────
// Контракт http_status:
//
// SetPassword → 200 OK
// ChangePassword → 200 OK
// VerifyPassword → 200 OK (valid=false НЕ является HTTP ошибкой —
// auth-orchestrator сам решает что вернуть клиенту;
// gRPC-ошибки (NOT_FOUND, INTERNAL) — отдельный канал)
// HasPassword → 200 OK
// ─────────────────────────────────────────────

message SetPasswordRequest {
	string account_id = 1;
	string plain_password = 2;
}

message SetPasswordResponse {
	account_vault.common.ResponseMeta meta = 1; // http_status=200
	string account_id = 2;
	google.protobuf.Timestamp updated_at = 3;
}

message ChangePasswordRequest {
	string account_id = 1;
	string old_plain_password = 2;
	string new_plain_password = 3;
}

message ChangePasswordResponse {
	account_vault.common.ResponseMeta meta = 1; // http_status=200
	string account_id = 2;
	google.protobuf.Timestamp updated_at = 3;
}

message VerifyPasswordRequest {
	string account_id = 1;
	string plain_password = 2;
}

enum VerifyFailureReason {
	VERIFY_FAILURE_REASON_UNSPECIFIED = 0;
	VERIFY_FAILURE_REASON_WRONG_PASSWORD = 1;
	VERIFY_FAILURE_REASON_NO_PASSWORD = 2;
	VERIFY_FAILURE_REASON_ACCOUNT_NOT_FOUND = 3;
}

// VerifyPasswordResponse всегда http_status=200 — результат проверки,
// а не HTTP-ошибка. auth-orchestrator использует `valid` и `failure_reason`
// чтобы сформировать собственный ответ (401, audit event, rate-limit increment).
message VerifyPasswordResponse {
	account_vault.common.ResponseMeta meta = 1;
	bool valid = 2;
	optional VerifyFailureReason failure_reason = 3;
}

message HasPasswordRequest {
	string account_id = 1;
}

message HasPasswordResponse {
	account_vault.common.ResponseMeta meta = 1; // http_status=200
	bool has_password = 2;
}

service AccountVaultCredentials {
	rpc SetPassword (SetPasswordRequest) returns (SetPasswordResponse);
	rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
	rpc VerifyPassword (VerifyPasswordRequest) returns (VerifyPasswordResponse);
	rpc HasPassword (HasPasswordRequest) returns (HasPasswordResponse);
}